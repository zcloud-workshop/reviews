# 本工作流使用了未经 GitHub 认证的第三方 action（subosito/flutter-action），
# 它们由第三方提供，并受单独的服务条款、隐私政策和支持文档约束。

name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name == 'release' && 'release' || 'test' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_from_main: ${{ steps.release_source.outputs.from_main }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Release 需要完整历史以确认标签提交属于 main，其余运行只取当前提交。
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}

      - name: 确认 Release 来源
        id: release_source
        if: github.event_name == 'release'
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "from_main=true" >> "$GITHUB_OUTPUT"
            echo "Release 标签提交属于 main，测试通过后构建 APK。"
          else
            echo "from_main=false" >> "$GITHUB_OUTPUT"
            echo "Release 标签提交不属于 main，本次仅执行静态分析与测试。"
          fi

      - name: 检查发布版本生成规则
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: 根据 Release 标签生成测试版本
        if: github.event_name == 'release' && steps.release_source.outputs.from_main == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/prepare_release_version.py

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 运行测试
        run: flutter test --no-pub

  build:
    name: 构建并发布 APK
    needs: test
    # 只有已发布的 Release，且标签提交属于 main，才可以读取签名和构建。
    if: github.event_name == 'release' && github.event.action == 'published' && needs.test.outputs.release_from_main == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出 Release 提交和 main 历史
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: 根据 Release 标签生成应用版本
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/prepare_release_version.py

      - name: 校验发布标签提交
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Release 标签已变更，拒绝构建与发布：$RELEASE_TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "发布提交不属于 main 历史，拒绝构建与发布：$RELEASE_TAG"
            exit 1
          fi

      # Android 的 Gradle 构建依赖 JDK，这里安装 Temurin 17。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 安装与本机一致的 stable 版 Flutter SDK，详见：
      # https://github.com/subosito/flutter-action/blob/main/README.md
      # 升级本机 Flutter 后请同步修改此版本号。
      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: 显示构建环境
        run: flutter doctor -v

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 配置固定签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ["ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("缺少签名 Secrets：" + ", ".join(missing))

          os.umask(0o077)
          keystore = Path(os.environ["RUNNER_TEMP"]) / "reviews-release.jks"
          try:
              keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          except ValueError:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 格式无效") from None

          # Java Properties 用 Unicode 转义保存任意密码和路径，避免特殊字符改变解析结果。
          def escape(value):
              encoded = value.encode("utf-16-be")
              return "".join("\\u" + encoded[index:index + 2].hex() for index in range(0, len(encoded), 2))

          properties = {
              "storeFile": str(keystore),
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          Path("android/key.properties").write_text(
              "".join(name + "=" + escape(value) + "\n" for name, value in properties.items()),
              encoding="ascii",
          )
          PY

      - name: 构建各架构 release APK
        run: flutter build apk --release --split-per-abi --no-pub

      - name: 校验 APK 固定签名
        run: |
          expected=$(tr -d '[:space:]' < android/signing-certificate.sha256)
          for abi in armeabi-v7a arm64-v8a x86_64; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
              "build/app/outputs/flutter-apk/app-$abi-release.apk" > "$RUNNER_TEMP/reviews-apk-certificate.txt"
            actual=$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' "$RUNNER_TEMP/reviews-apk-certificate.txt")
            if [ "$actual" != "$expected" ]; then
              echo "$abi APK 签名证书与项目固定证书不一致"
              exit 1
            fi
            echo "$abi APK 签名证书 SHA-256：$actual"
          done

      - name: 重命名 APK
        env:
          APP_NAME: ${{ steps.metadata.outputs.app_name }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p build/apk-artifacts
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "build/apk-artifacts/$APP_NAME-$abi-$APP_VERSION.apk"
          done

      - name: 上传 ARM 32 位 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.app_name }}-armeabi-v7a-${{ steps.metadata.outputs.version }}
          path: build/apk-artifacts/${{ steps.metadata.outputs.app_name }}-armeabi-v7a-${{ steps.metadata.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 上传 ARM 64 位 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.app_name }}-arm64-v8a-${{ steps.metadata.outputs.version }}
          path: build/apk-artifacts/${{ steps.metadata.outputs.app_name }}-arm64-v8a-${{ steps.metadata.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 上传 x86 64 位 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.app_name }}-x86_64-${{ steps.metadata.outputs.version }}
          path: build/apk-artifacts/${{ steps.metadata.outputs.app_name }}-x86_64-${{ steps.metadata.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 上传 APK 到已发布的 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" build/apk-artifacts/*.apk --clobber

      - name: 清理签名文件
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/reviews-release.jks"
