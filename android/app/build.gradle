plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 根据发布版本生成内部编号，本地与 CI 均无需单独维护构建号。
def appVersionName = flutter.versionName
def versionMatch = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/
if (!versionMatch.matches()) {
    throw new GradleException("应用版本格式无效，请使用 0.1.0 这样的版本号。")
}
def (majorVersion, minorVersion, patchVersion) = (1..3).collect { versionMatch.group(it).toBigInteger() }
if (minorVersion >= 1000 || patchVersion >= 1000) {
    throw new GradleException("次版本号和修订版本号必须小于 1000。")
}
def appVersionCode = majorVersion * 1000000 + minorVersion * 1000 + patchVersion + 1
// Flutter 分架构 APK 最多追加 4000，预留后仍须满足 Android 的编号上限。
if (appVersionCode + 4000 > 2100000000) {
    throw new GradleException("应用版本超出 Android versionCode 支持范围。")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// 仅在 Release 构建时检查密钥，普通 Debug 开发无需发布签名。
def validateReleaseSigning = tasks.register("validateReleaseSigning") {
    doLast {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException("缺少 android/key.properties，请按 docs/ci-workflow.md 配置固定签名。")
        }
        def requiredProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        def missingProperties = requiredProperties.findAll { !keystoreProperties.getProperty(it) }
        if (!missingProperties.isEmpty()) {
            throw new GradleException("签名配置缺少字段：${missingProperties.join(', ')}")
        }
        if (!file(keystoreProperties.getProperty("storeFile")).isFile()) {
            throw new GradleException("签名 keystore 文件不存在，请检查 android/key.properties 的 storeFile。")
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild" || name == "validateSigningRelease") {
        dependsOn(validateReleaseSigning)
    }
}

android {
    namespace = "com.quiz.reviews"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.quiz.reviews"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = appVersionCode.intValue()
        versionName = appVersionName
    }

    packagingOptions {
        resources {
            excludes += "META-INF/DEPENDENCIES"
        }
    }

    dependencies {
        implementation 'org.apache.poi:poi:5.2.2'
        implementation 'org.apache.poi:poi-scratchpad:5.2.2'
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties.getProperty("keyAlias")
            keyPassword = keystoreProperties.getProperty("keyPassword")
            storeFile = keystoreProperties.getProperty("storeFile") ? file(keystoreProperties.getProperty("storeFile")) : null
            storePassword = keystoreProperties.getProperty("storePassword")
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
